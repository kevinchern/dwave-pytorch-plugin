---
prelude: >
    Graph-restricted Boltzmann machines and their samplers now store one quadratic bias per edge
    and build the dense coupling matrix on the fly wherever a matrix product is the efficient
    computation: energies, effective fields and block-Gibbs updates are dense matrix products,
    while parameters, gradients, optimizer state and the interfaces of the samplers have one
    entry per node and per edge. This release is not backward compatible; see the upgrade notes.
features:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` is a per-edge ``(n_edges,)`` parameter in the
    order of ``edges``. New methods ``effective_field``, ``sufficient_statistics``,
    ``conditional_expectation`` and ``pad_visible``; new attributes ``visible_nodes``,
    ``n_visible``, ``n_hidden`` and ``connected_hidden``. All methods accept arbitrary leading
    batch dimensions.
  - |
    ``quasi_objective`` takes complete spin configurations of data and model. For models with
    hidden units, ``conditional_expectation`` fills in the exact conditional expectations of the
    hidden units (or of any set of pairwise non-adjacent unknown spins), and
    ``TorchSampler.complete`` fills in samples drawn conditioned on the data by any sampler (for
    example ``DimodSampler`` or ``BlockSampler``). Both keep the objective differentiable with
    respect to the observations.
  - |
    Samplers are ``torch.nn.Module`` subclasses holding the model as the submodule ``model``:
    ``sampler.to(device)``, ``state_dict()`` and friends act on model and sampler state together.
    ``BlockSampler`` computes effective fields with one matrix product per block, computes a greedy
    colouring when none is given, and supports conditional sampling of arbitrary partially observed
    spins (any number of free blocks, ``num_samples`` per row, arbitrary batch dimensions) without
    modifying its persistent chains. A restricted Boltzmann machine is sampled by colouring its
    visible and hidden layers.
  - |
    ``DimodSampler`` submits binary quadratic models built directly from the tensors, and builds
    conditional models from the model's dense effective fields on the subgraph of the free
    variables (no per-row ``fix_variables``), applying ``prefactor`` and clipping consistently.
    ``DimodSampler.to_bqm`` returns the model as it is submitted to the wrapped sampler.
    ``dwave.plugins.torch.utils.to_bqm`` converts the biases of an Ising model on a
    ``GraphIndex`` to a ``dimod.BinaryQuadraticModel`` without intermediate dictionaries, and
    ``dwave.plugins.torch.utils.sampleset_to_tensor`` repeats aggregated samples according to
    ``num_occurrences``, which replaces the dependency on ``dwave-hybrid``.
  - |
    ``dwave.plugins.torch.graph.GraphIndex`` is the ``torch.nn.Module`` base class of
    ``GraphRestrictedBoltzmannMachine``. It validates the graph and provides the
    graph attributes ``nodes``, ``edges``, ``node_to_idx``, ``edge_to_idx``, ``n_nodes`` and
    ``n_edges``, the buffers ``edge_idx_i`` and ``edge_idx_j``, the coupling matrices
    ``dense_quadratic`` and ``symmetric_coupling`` of per-edge biases, and the Ising ``energy``
    and ``effective_field`` of spins under explicitly given per-edge biases, for a single model or
    a batch of models on the graph. ``dwave.plugins.torch.graph`` holds the graph core and
    imports nothing but PyTorch; ``dwave.plugins.torch.utils`` holds the dimod conversions and
    ``estimate_beta``, which estimates the inverse temperature of samples of such a model by
    maximum pseudolikelihood and imports ``dwave.system`` only when called, so the model and
    ``BlockSampler`` import without it.
  - |
    Samplers bind to any ``GraphIndex`` and gain ``sample_biases(linear, quadratic)``, which
    samples a batch of Ising models on the graph given by their per-edge biases. ``BlockSampler`` updates
    every block for all models and chains with one batched matrix product, so batches of models
    are sampled on the GPU; ``DimodSampler`` scales, clips and submits the models one after the
    other. ``sample`` and ``complete`` keep sampling the parameters of a bound
    ``GraphRestrictedBoltzmannMachine``.
upgrade:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` has shape ``(n_edges,)`` and holds the bias of
    every edge in the order of ``edges``, irrespective of the orientation given at construction.
    ``sufficient_statistics`` returns batch-averaged statistics in the layout of the parameters
    instead of per-sample statistics.
    ``theta``, ``interactions``, ``to_ising`` (use ``DimodSampler.to_bqm`` or
    ``dwave.plugins.torch.utils.to_bqm``, and ``bqm.to_ising()`` for the dictionaries),
    ``idx_to_node`` (use ``nodes[idx]``) and the deprecated
    ``sample``/``sampleset_to_tensor`` methods are removed. ``edge_idx_i``/
    ``edge_idx_j`` hold the smaller/larger node index of each edge irrespective of the orientation
    given at construction. Duplicate nodes or edges, unknown edge endpoints and unknown hidden nodes
    raise ``ValueError``.
  - |
    The parameters of ``GraphRestrictedBoltzmannMachine`` are registered under their public
    names, and the index buffers (``edge_idx_i``, ``edge_idx_j``, ``visible_idx`` and
    ``hidden_idx``) are derived from the constructor arguments and not saved, so the keys of
    ``state_dict()`` are ``linear`` and ``quadratic`` (``model.linear``, ``model.quadratic`` and
    ``state`` for a ``BlockSampler``); checkpoints saved with earlier versions cannot be loaded.
    ``nodes``, ``edges``, ``hidden_nodes`` and ``visible_nodes`` are tuples.
  - |
    ``quasi_objective(s_data, s_model)`` no longer takes ``kind``, ``sampler``, ``prefactor``,
    ``linear_range``, ``quadratic_range`` or ``sample_kwargs``: data of a model with hidden units
    is completed beforehand with ``conditional_expectation`` (formerly ``kind="exact-disc"``) or
    ``sampler.complete`` (formerly ``kind="sampling"``), and the sampling arguments moved to
    ``DimodSampler``. The objective is a 0-d tensor.
  - |
    Samplers take the model as their first argument (``model``), hold it as a submodule and are
    moved in place by ``to()``. Their configuration is exposed as plain attributes:
    ``BlockSampler.schedule``, ``BlockSampler.proposal_acceptance_criteria``,
    ``DimodSampler.sampler``, ``DimodSampler.prefactor``, ``DimodSampler.linear_range``,
    ``DimodSampler.quadratic_range`` and ``DimodSampler.sample_kwargs``. ``BlockSampler`` exposes
    ``state`` (the buffer holding the persistent chains, a key of ``state_dict()``),
    ``partition`` and ``seed`` instead of parameters; conditional ``sample(x)`` returns
    ``(..., num_samples, n_nodes)`` and requires ``x`` to have shape ``(..., n_nodes)`` (the batch
    size no longer has to equal the number of chains). Unseeded samplers draw from the global
    PyTorch generator. ``DimodSampler.sample_set`` is the sample set as returned by the wrapped
    sampler.
    ``TorchSampler`` subclasses implement ``sample_biases`` in addition to ``sample``, and
    ``sample``, ``complete`` and ``DimodSampler.to_bqm`` raise ``TypeError`` when the sampler is
    bound to a graph module that is not a ``GraphRestrictedBoltzmannMachine``.
  - |
    ``BipartiteGibbsSampler`` is removed. ``BlockSampler(model, colouring=lambda node: node in
    hidden)`` is the same two-block Gibbs sampler (visible units first, hidden units second) and
    raises ``ValueError`` for an edge within a layer, as the removed class did.
  - |
    ``randspin`` moved from ``dwave.plugins.torch.tensor`` to ``dwave.plugins.torch.graph`` and
    the ``tensor`` module is removed.
  - |
    ``dwave-hybrid`` is no longer a dependency.
fixes:
  - |
    The random initialisation of the quadratic biases of ``GraphRestrictedBoltzmannMachine`` put
    every model in the spin-glass phase at unit inverse temperature (an effective coupling of 2.5
    against a transition at 1), while its docstring claimed the paramagnetic phase. The standard
    deviation of the bias of edge ``(u, v)`` is now ``1 / (init_temperature * (deg(u) deg(v)) ** 0.25)``,
    where the new constructor argument ``init_temperature`` is the initial temperature in units of
    the model's critical temperature. Its default of 4 reproduces Hinton's standard deviation of
    0.01 on a 784-by-500 restricted Boltzmann machine and keeps Zephyr and Pegasus graphs far
    inside the paramagnetic phase.
  - |
    Effective fields of hidden units were wrong whenever a hidden node was the first endpoint of
    some edges and the second endpoint of others (neighbours were paired with the wrong weights), and
    were ``NaN`` for models with connected hidden units.
  - |
    Conditional sampling of hidden units did not scale the effective fields by ``prefactor`` and
    ignored ``num_occurrences``; sampling the hidden units for the quasi-objective failed with the
    default arguments.
  - |
    The ``Ising`` layer ignored ``num_occurrences`` of aggregated sample sets, which a QPU returns
    by default, so repeated reads counted once in its outputs and gradients, and it failed when
    the numbers of distinct samples differed between batch elements.
  - |
    ``TorchSampler.to()`` no longer leaves the original sampler half-moved; ``GaussianKernel`` no
    longer produces zero bandwidths for integer ``factor``; ``tests/test_samplers`` is now
    collected by test discovery.
  - |
    A ``Kernel`` no longer requires at least two items per input; that requirement belongs to the
    maximum mean discrepancy and is enforced by ``maximum_mean_discrepancy_loss``. Kernels take
    ``(..., n, F)`` tensors of ``F``-dimensional items, with broadcasting batch dimensions, and
    return ``(..., n_x, n_y)`` kernel matrices; items with several feature dimensions are
    flattened by the caller, as ``maximum_mean_discrepancy_loss`` does. The docstrings of
    ``Kernel`` and ``GaussianKernel`` describe what is computed: ``exp(-d^2 / sigma_i)`` with the
    base bandwidth the mean squared distance between distinct items, estimated per batch element.
  - |
    A seeded ``BlockSampler`` drew its initial states and its first sweep from two generators with
    the same seed, and reseeded from scratch whenever it changed device. All draws now descend from
    one generator seeded at construction, and moving the sampler to another device starts a new
    stream derived from it.
