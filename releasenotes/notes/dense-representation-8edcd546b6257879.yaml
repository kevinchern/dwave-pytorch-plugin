---
prelude: >
    Graph-restricted Boltzmann machines and their samplers now use a dense representation
    throughout: quadratic biases are stored in a masked ``(n_nodes, n_nodes)`` matrix and all
    computations---energies, learning statistics, effective fields and block-Gibbs updates---are
    dense matrix products. This release is not backward compatible; see the upgrade notes.
features:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` is a dense, strictly upper-triangular
    ``(n_nodes, n_nodes)`` parameter whose off-graph entries are structurally zero (masked by the new
    ``adjacency`` buffer). New methods ``coupling``, ``symmetric_coupling``, ``edge_biases``,
    ``effective_field``, ``sufficient_statistics``, ``conditional_expectation`` and
    ``pad_visible``; new attributes ``adjacency``, ``visible_nodes``, ``n_visible``, ``n_hidden``
    and ``connected_hidden``. All methods accept arbitrary leading batch dimensions.
  - |
    ``quasi_objective`` takes complete spin configurations of data and model. For models with
    hidden units, ``conditional_expectation`` fills in the exact conditional expectations of the
    hidden units (or of any set of pairwise non-adjacent unknown spins), and
    ``TorchSampler.complete`` fills in samples drawn conditioned on the data by any sampler (for
    example ``DimodSampler`` or ``BlockSampler``). Both keep the objective differentiable with
    respect to the observations.
  - |
    Samplers are ``torch.nn.Module`` subclasses holding the model as the submodule ``model``:
    ``sampler.to(device)``, ``state_dict()`` and friends act on model and sampler state together.
    ``BlockSampler`` computes effective fields with one matrix product per block, computes a greedy
    colouring when none is given, and supports conditional sampling of arbitrary partially observed
    spins (any number of free blocks, ``num_samples`` per row, arbitrary batch dimensions) without
    modifying its persistent chains. ``BipartiteGibbsSampler`` is a two-block ``BlockSampler``.
  - |
    ``DimodSampler`` builds conditional binary quadratic models from the model's dense effective
    fields (no per-row ``fix_variables``) and applies ``prefactor`` and clipping consistently.
    ``DimodSampler.to_ising`` returns the model as it is submitted to the wrapped sampler.
    ``dwave.plugins.torch.utils.to_ising`` and ``dwave.plugins.torch.utils.to_bqm`` convert
    biases to dimod's Ising dictionaries and to a ``dimod.BinaryQuadraticModel``, and
    ``dwave.plugins.torch.utils.sampleset_to_tensor`` repeats aggregated samples according to
    ``num_occurrences``, which replaces the dependency on ``dwave-hybrid``.
  - |
    ``dwave.plugins.torch.utils.GraphIndex`` is the ``torch.nn.Module`` base class of
    ``GraphRestrictedBoltzmannMachine`` and ``Ising``. It validates the graph and provides the
    graph attributes ``nodes``, ``edges``, ``node_to_idx``, ``n_nodes`` and ``n_edges``, the
    buffers ``edge_idx_i``, ``edge_idx_j`` and ``adjacency``, the conversions ``edge_biases``
    and ``dense_quadratic`` between per-edge and dense quadratic biases, and the Ising
    ``energy``, ``coupling``, ``symmetric_coupling`` and ``effective_field`` of spins under
    explicitly given biases, for a single model or a batch of models on the graph.
    ``dwave.plugins.torch.utils.estimate_beta`` estimates the inverse temperature of samples of
    such a model by maximum pseudolikelihood.
  - |
    Samplers bind to any ``GraphIndex`` and gain ``sample_biases(linear, quadratic)``, which
    samples a batch of Ising models on the graph given by their biases. ``BlockSampler`` updates
    every block for all models and chains with one batched matrix product, so batches of models
    are sampled on the GPU; ``DimodSampler`` scales, clips and submits the models one after the
    other. ``sample`` and ``complete`` keep sampling the parameters of a bound
    ``GraphRestrictedBoltzmannMachine``.
  - |
    The ``Ising`` layer no longer samples: ``forward(linear, quadratic, spins)`` takes the spins
    sampled from its inputs by the ``sample_biases`` method of any sampler bound to the layer, in
    the same way that ``quasi_objective`` takes the samples of a Boltzmann machine. The layer
    therefore works with ``BlockSampler`` on the GPU as well as with ``DimodSampler``, whose
    ``prefactor`` and clipping ranges replace the layer's ``beta``. The layer takes dense
    ``(B, n_nodes, n_nodes)`` quadratic biases and returns dense gradients (nonzero only at edges);
    ``edge_biases`` and ``dense_quadratic`` convert between per-edge and dense biases.
    ``SpinStatistic`` is a ``torch.nn.Module``, so the statistic of a layer moves to the device of
    the layer, and ``IsingStatistic.from_graph`` builds the sufficient statistics of a graph's
    Ising model.
  - |
    ``dwave.plugins.torch.nn.functional.gumbel_spins`` samples spins from encoder logits with the
    straight-through Gumbel-softmax estimator. It is the default ``latent_to_discrete`` map of
    ``DiscreteVariationalAutoencoder``, whose ``encoder``, ``decoder`` and ``latent_to_discrete``
    are plain attributes.
  - |
    ``dwave.plugins.torch.nn`` exports the kernels, losses and Ising modules;
    ``dwave.plugins.torch.samplers`` exports ``BipartiteGibbsSampler``.
upgrade:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` has shape ``(n_nodes, n_nodes)``; per-edge biases
    are ``quadratic[edge_idx_i, edge_idx_j]`` (``edge_biases()``). ``sufficient_statistics`` returns
    batch-averaged statistics in the layout of the parameters instead of per-sample statistics.
    ``theta``, ``interactions``, ``to_ising`` (use ``dwave.plugins.torch.utils.to_ising`` or
    ``DimodSampler.to_ising``), ``idx_to_node`` (use ``nodes[idx]``) and the deprecated
    ``sample``/``sampleset_to_tensor`` methods are removed. ``edge_idx_i``/
    ``edge_idx_j`` hold the smaller/larger node index of each edge irrespective of the orientation
    given at construction. Duplicate nodes or edges, unknown edge endpoints and unknown hidden nodes
    raise ``ValueError``.
  - |
    The parameters and buffers of ``GraphRestrictedBoltzmannMachine`` are registered under their
    public names, so the keys of ``state_dict()`` are ``linear``, ``quadratic``, ``adjacency``,
    ``edge_idx_i``, ``edge_idx_j``, ``visible_idx`` and ``hidden_idx`` instead of
    underscore-prefixed names; checkpoints saved with earlier versions cannot be loaded.
    ``nodes``, ``edges``, ``hidden_nodes`` and ``visible_nodes`` are tuples.
  - |
    ``quasi_objective(s_data, s_model)`` no longer takes ``kind``, ``sampler``, ``prefactor``,
    ``linear_range``, ``quadratic_range`` or ``sample_kwargs``: data of a model with hidden units
    is completed beforehand with ``conditional_expectation`` (formerly ``kind="exact-disc"``) or
    ``sampler.complete`` (formerly ``kind="sampling"``), and the sampling arguments moved to
    ``DimodSampler``. The objective is a 0-d tensor.
  - |
    Samplers take the model as their first argument (``model``), hold it as a submodule and are
    moved in place by ``to()``. Their configuration is exposed as plain attributes:
    ``BlockSampler.schedule``, ``BlockSampler.proposal_acceptance_criteria``,
    ``DimodSampler.sampler``, ``DimodSampler.prefactor``, ``DimodSampler.linear_range``,
    ``DimodSampler.quadratic_range`` and ``DimodSampler.sample_kwargs``. ``BlockSampler`` exposes
    ``state`` (the buffer holding the persistent chains, a key of ``state_dict()``),
    ``partition`` and ``seed`` instead of parameters; conditional ``sample(x)`` returns
    ``(..., num_samples, n_nodes)`` and requires ``x`` to have shape ``(..., n_nodes)`` (the batch
    size no longer has to equal the number of chains). ``BipartiteGibbsSampler`` rejects
    hidden-hidden as well as visible-visible edges. Unseeded samplers draw from the global PyTorch
    generator. ``DimodSampler.sample_set`` is the sample set as returned by the wrapped sampler.
    ``TorchSampler`` subclasses implement ``sample_biases`` in addition to ``sample``, and
    ``sample``, ``complete`` and ``DimodSampler.to_ising`` raise ``TypeError`` when the sampler is
    bound to a graph module that is not a ``GraphRestrictedBoltzmannMachine``.
  - |
    ``Ising(nodes, edges, statistic=None)`` no longer takes ``sampler``, ``sample_params`` or
    ``beta``, and ``set_sampler``, ``set_sample_params``, ``set_beta`` and the ``beta`` buffer are
    removed. ``Ising.forward(linear, quadratic, spins)`` and
    ``Ising.estimate_betas(linear, quadratic, spins)`` take dense quadratic biases and the spins
    sampled from the models, e.g. ``BlockSampler(ising).sample_biases(linear, quadratic)`` or
    ``DimodSampler(ising, sampler, prefactor=1 / beta).sample_biases(linear, quadratic)``.
    ``node_idx_of_edges_1``/``node_idx_of_edges_2`` are renamed ``edge_idx_i``/``edge_idx_j``,
    ``num_nodes``/``num_edges`` are renamed ``n_nodes``/``n_edges``, and ``nodes`` and ``edges``
    are tuples. ``IdentityStatistic`` takes ``dim_out`` and ``IsingStatistic`` stores its indices
    as buffers.
  - |
    The generic neural-network utilities ``Affine``, ``SkipLinear``, ``LinearBlock`` and
    ``store_config`` are removed from ``dwave.plugins.torch.nn``; ``torch.nn`` provides the
    building blocks they were composed of.
  - |
    ``pseudo_kl_divergence_loss`` moved from ``dwave.plugins.torch.models.losses`` to
    ``dwave.plugins.torch.nn.functional`` and the ``models.losses`` package is removed.
    ``randspin`` moved from ``dwave.plugins.torch.tensor`` to ``dwave.plugins.torch.utils`` and
    the ``tensor`` module is removed. ``dwave.plugins.torch.nn.modules.ising`` is a module holding
    ``Ising`` and ``IsingExpectation``; the statistics are in
    ``dwave.plugins.torch.nn.modules.spin_statistic``. All of these remain exported by
    ``dwave.plugins.torch.nn``.
  - |
    ``DiscreteVariationalAutoencoder`` registers its encoder and decoder as ``encoder`` and
    ``decoder``, so the keys of ``state_dict()`` lose their leading underscores.
  - |
    ``dwave-hybrid`` and ``einops`` are no longer dependencies, and ``dwave-graphs`` is required only
    by the tests and examples. Package discovery is restricted to the ``dwave`` namespace, and the
    ``setup.py`` shim is removed in favour of ``pyproject.toml``.
fixes:
  - |
    Effective fields of hidden units were wrong whenever a hidden node was the first endpoint of
    some edges and the second endpoint of others (neighbours were paired with the wrong weights), and
    were ``NaN`` for models with connected hidden units.
  - |
    Conditional sampling of hidden units did not scale the effective fields by ``prefactor`` and
    ignored ``num_occurrences``; sampling the hidden units for the quasi-objective failed with the
    default arguments.
  - |
    ``pseudo_kl_divergence_loss`` averaged the encoder entropy over spins instead of summing it,
    under-weighting the entropy by the number of spins.
  - |
    The ``Ising`` layer ignored ``num_occurrences`` of aggregated sample sets, which a QPU returns
    by default, so repeated reads counted once in its outputs and gradients, and it failed when
    the numbers of distinct samples differed between batch elements.
  - |
    ``TorchSampler.to()`` no longer leaves the original sampler half-moved; ``GaussianKernel`` no
    longer produces zero bandwidths for integer ``factor``; ``tests/test_samplers`` is now
    collected by test discovery.
