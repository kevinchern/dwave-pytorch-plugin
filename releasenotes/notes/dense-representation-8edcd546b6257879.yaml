---
prelude: >
    Graph-restricted Boltzmann machines and their samplers now use a dense representation
    throughout: quadratic biases are stored in a masked ``(n_nodes, n_nodes)`` matrix and all
    computations---energies, learning statistics, effective fields and block-Gibbs updates---are
    dense matrix products. This release is not backward compatible; see the upgrade notes.
features:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` is a dense, strictly upper-triangular
    ``(n_nodes, n_nodes)`` parameter whose off-graph entries are structurally zero (masked by the new
    ``adjacency`` buffer). New methods ``coupling``, ``symmetric_coupling``, ``edge_biases``,
    ``effective_field``, ``sufficient_statistics``, ``conditional_expectation`` and
    ``pad_visible``; new attributes ``adjacency``, ``visible_nodes``, ``n_visible``, ``n_hidden``
    and ``connected_hidden``. All methods accept arbitrary leading batch dimensions.
  - |
    ``quasi_objective`` takes complete spin configurations of data and model. For models with
    hidden units, ``conditional_expectation`` fills in the exact conditional expectations of the
    hidden units (or of any set of pairwise non-adjacent unknown spins), and
    ``TorchSampler.complete`` fills in samples drawn conditioned on the data by any sampler (for
    example ``DimodSampler`` or ``BlockSampler``). Both keep the objective differentiable with
    respect to the observations.
  - |
    Samplers are ``torch.nn.Module`` subclasses holding the model as the submodule ``model``:
    ``sampler.to(device)``, ``state_dict()`` and friends act on model and sampler state together.
    ``BlockSampler`` computes effective fields with one matrix product per block, computes a greedy
    colouring when none is given, and supports conditional sampling of arbitrary partially observed
    spins (any number of free blocks, ``num_samples`` per row, arbitrary batch dimensions) without
    modifying its persistent chains. ``BipartiteGibbsSampler`` is a two-block ``BlockSampler``.
  - |
    ``DimodSampler`` builds conditional binary quadratic models from the model's dense effective
    fields (no per-row ``fix_variables``), applies ``prefactor`` and clipping consistently, and
    expands aggregated sample sets. ``DimodSampler.to_ising`` returns the model as it is submitted
    to the wrapped sampler. ``dwave.plugins.torch.utils.to_ising`` converts biases to dimod's Ising
    dictionaries, ``dwave.plugins.torch.utils.spread`` replaces the dependency on ``dwave-hybrid``
    and ``dwave.plugins.torch.utils.GraphIndex`` provides shared graph indexing.
  - |
    The ``Ising`` layer takes dense ``(B, n_nodes, n_nodes)`` quadratic biases and returns dense
    gradients (nonzero only at edges); ``edge_biases`` and ``dense_quadratic`` convert between
    per-edge and dense biases.
  - |
    ``dwave.plugins.torch.nn`` exports the kernels, losses and Ising modules;
    ``dwave.plugins.torch.samplers`` exports ``BipartiteGibbsSampler``.
upgrade:
  - |
    ``GraphRestrictedBoltzmannMachine.quadratic`` has shape ``(n_nodes, n_nodes)``; per-edge biases
    are ``quadratic[edge_idx_i, edge_idx_j]`` (``edge_biases()``). ``sufficient_statistics`` returns
    batch-averaged statistics in the layout of the parameters instead of per-sample statistics.
    ``theta``, ``interactions``, ``to_ising`` (use ``dwave.plugins.torch.utils.to_ising`` or
    ``DimodSampler.to_ising``), ``idx_to_node`` (use ``nodes[idx]``) and the deprecated
    ``sample``/``sampleset_to_tensor`` methods are removed. ``edge_idx_i``/
    ``edge_idx_j`` hold the smaller/larger node index of each edge irrespective of the orientation
    given at construction. Duplicate nodes or edges, unknown edge endpoints and unknown hidden nodes
    raise ``ValueError``.
  - |
    The parameters and buffers of ``GraphRestrictedBoltzmannMachine`` are registered under their
    public names, so the keys of ``state_dict()`` are ``linear``, ``quadratic``, ``adjacency``,
    ``edge_idx_i``, ``edge_idx_j``, ``visible_idx`` and ``hidden_idx`` instead of
    underscore-prefixed names; checkpoints saved with earlier versions cannot be loaded.
    ``nodes``, ``edges``, ``hidden_nodes`` and ``visible_nodes`` are tuples and ``node_to_idx``
    is a read-only mapping.
  - |
    ``quasi_objective(s_data, s_model)`` no longer takes ``kind``, ``sampler``, ``prefactor``,
    ``linear_range``, ``quadratic_range`` or ``sample_kwargs``: data of a model with hidden units
    is completed beforehand with ``conditional_expectation`` (formerly ``kind="exact-disc"``) or
    ``sampler.complete`` (formerly ``kind="sampling"``), and the sampling arguments moved to
    ``DimodSampler``. The objective is a 0-d tensor.
  - |
    Samplers take the model as their first argument (``model``), hold it as a submodule and are
    moved in place by ``to()``. ``BlockSampler`` exposes ``state``, ``partition``, ``schedule`` and
    ``seed`` instead of parameters; conditional ``sample(x)`` returns ``(..., num_samples, n_nodes)``
    and requires ``x`` to have shape ``(..., n_nodes)`` (the batch size no longer has to equal the
    number of chains). ``BipartiteGibbsSampler`` rejects hidden-hidden as well as visible-visible
    edges. Unseeded samplers draw from the global PyTorch generator.
  - |
    ``Ising.forward`` and ``Ising.estimate_betas`` take dense quadratic biases; ``node_idx_of_edges_1``/
    ``node_idx_of_edges_2`` are renamed ``edge_idx_i``/``edge_idx_j`` and ``beta`` is a buffer.
  - |
    ``dwave-hybrid`` and ``einops`` are no longer dependencies. Package discovery is restricted to the
    ``dwave`` namespace.
fixes:
  - |
    Effective fields of hidden units were wrong whenever a hidden node was the first endpoint of
    some edges and the second endpoint of others (neighbours were paired with the wrong weights), and
    were ``NaN`` for models with connected hidden units.
  - |
    Conditional sampling of hidden units did not scale the effective fields by ``prefactor`` and
    ignored ``num_occurrences``; sampling the hidden units for the quasi-objective failed with the
    default arguments.
  - |
    ``pseudo_kl_divergence_loss`` averaged the encoder entropy over spins instead of summing it,
    under-weighting the entropy by the number of spins.
  - |
    ``TorchSampler.to()`` no longer leaves the original sampler half-moved; ``GaussianKernel`` no
    longer produces zero bandwidths for integer ``factor``; ``tests/test_samplers`` is now collected
    by test discovery.
